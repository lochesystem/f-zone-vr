<!doctype html><html><title>Pulse Wraith inspection</title><style>body{margin:0}button{padding:14px}nav{position:fixed}</style><nav><button id="front">Frente</button><button id="rear">Traseira</button><button id="side">Lateral</button></nav><script type="module">
