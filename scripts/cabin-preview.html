<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Astra — inspeção da cabine</title>
<style>body{margin:0;background:#0b1620;color:white;font:14px sans-serif}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;top:12px;left:12px}button{padding:12px;background:#17343b;color:#bceef3;border:1px solid #518d98;margin:4px}</style>
<nav><button data-view="front">Frente</button><button data-view="floor">Assoalho</button><button data-view="left">Esquerda</button><button data-view="right">Direita</button><button data-view="rear">Atrás</button></nav><canvas></canvas>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import {createAstraCabin,mountAstraDisplay} from '/app/game/astra-cabin.ts';
import {prepareAstraModel} from '/app/game/astra-model.ts';
import {preparePulseModel} from '/app/game/pulse-model.ts';
import {drawAstraInstruments} from '/app/game/astra-instruments.ts';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x263c50);scene.add(new THREE.HemisphereLight(0xb8e4ff,0x253039,2));const sun=new THREE.DirectionalLight(0xffecce,2.5);sun.position.set(10,15,-5);scene.add(sun);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,200);camera.position.set(0,1.28,.12);
const pulse=new URLSearchParams(location.search).has('pulse');scene.add(createAstraCabin(pulse));
const ship=(pulse?preparePulseModel:prepareAstraModel)((await new GLTFLoader().loadAsync(pulse?'/models/pulse.glb':'/models/astra.glb')).scene,true);ship.scale.multiplyScalar(.72);ship.position.set(0,.02,.62);scene.add(ship);
for(const kind of ['speed','map']){const canvas=document.createElement('canvas');canvas.width=512;canvas.height=kind==='speed'?256:360;const ctx=canvas.getContext('2d');
if(kind==='speed')drawAstraInstruments(ctx,{speed:428,energy:68,charging:false,position:2,racers:6,lap:2,laps:4,lives:3,shield:2,slots:['METRALHADORA 20','ESCUDO'],activeSlot:0});
else{ctx.fillStyle='#061219';ctx.fillRect(0,0,512,360);ctx.strokeStyle='#29505c';for(let x=0;x<512;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,360);ctx.stroke();}ctx.strokeStyle='#69cddd';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(90,90);ctx.lineTo(360,70);ctx.lineTo(410,240);ctx.lineTo(260,280);ctx.lineTo(210,175);ctx.lineTo(80,200);ctx.closePath();ctx.stroke();ctx.fillStyle='#ff90b4';ctx.beginPath();ctx.arc(270,76,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a5cfd6';ctx.font='20px monospace';ctx.fillText('NAV / HELIX VERGE',24,30);}
const mesh=new THREE.Mesh(new THREE.PlaneGeometry(kind==='speed'?.38:.48,kind==='speed'?.2:.34),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(canvas),toneMapped:false}));mountAstraDisplay(mesh,kind);scene.add(mesh);}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x405961}));ground.rotation.x=-Math.PI/2;ground.position.y=-.5;scene.add(ground);const grid=new THREE.GridHelper(100,30,0x6c8793,0x445d68);grid.position.y=-.49;scene.add(grid);
const rotations={front:[-.14,0,0],floor:[-.85,0,0],left:[-.35,.95,0],right:[-.35,-.95,0],rear:[-.3,Math.PI,0]};
function view(name){camera.rotation.set(...rotations[name],'YXZ');}view('front');document.querySelectorAll('button').forEach(b=>b.onclick=()=>view(b.dataset.view));
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></html>
